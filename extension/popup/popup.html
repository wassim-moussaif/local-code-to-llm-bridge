<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code-to-LLM Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-online { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .badge-offline { background: #450a0a; color: #f87171; border: 1px solid #dc2626; }

    .info-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .value {
      font-family: monospace;
      color: #e2e8f0;
      word-break: break-all;
      font-size: 11px;
    }

    .btn {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-outline { background: transparent; border: 1px solid #334155; color: #cbd5e1; margin-top: 8px; }
    .btn-outline:hover { background: #1e293b; color: white; }

    .shortcuts {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: #94a3b8;
    }
    .shortcut-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .kbd {
      background: #334155;
      padding: 1px 5px;
      border-radius: 3px;
      color: #f1f5f9;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡</span> Code-to-LLM
    </div>
    <span id="statusBadge" class="badge badge-offline">Checking...</span>
  </div>

  <div class="info-card">
    <div class="label">Local Server</div>
    <div class="value" id="serverUrl">http://127.0.0.1:3387</div>
  </div>

  <div class="info-card">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
      <div class="label" style="margin-bottom: 0;">Active Workspace</div>
      <button id="browseFolderBtn" title="Open File Explorer to choose folder" style="background: #0284c7; border: none; border-radius: 4px; color: #ffffff; font-size: 11px; font-weight: 600; padding: 2px 8px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
        <span>📁</span> Browse Folder
      </button>
    </div>
    <div class="value" id="workspacePath">Connecting...</div>
    <div style="margin-top: 8px; display: flex; gap: 4px;">
      <input type="text" id="newWorkspaceInput" placeholder="Or paste folder path..." style="flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 4px; padding: 4px 6px; color: #f8fafc; font-size: 11px; font-family: monospace;" />
      <button id="switchWorkspaceBtn" style="background: #334155; border: none; border-radius: 4px; color: #e2e8f0; font-size: 11px; font-weight: 600; padding: 0 8px; cursor: pointer;">Switch</button>
    </div>
  </div>

  <button id="refreshBtn" class="btn btn-primary">
    🔄 Test Connection
  </button>

  <div class="shortcuts">
    <div class="shortcut-row">
      <span>Push Code modal</span>
      <span class="kbd">Ctrl + Shift + K</span>
    </div>
    <div class="shortcut-row">
      <span>Supported LLMs</span>
      <span style="color: #38bdf8;">AI Studio / Gemini / ChatGPT / Claude</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
